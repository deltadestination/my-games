<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pythonio y la Herencia Loca - POO en Python</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#e9f1fb; --card:#ffffff; --ink:#13233d; --muted:#4c5f7d; --edge:#13233d; --soft:#cfdcf0;
  --accent:#3776ab; --on-accent:#ffffff; --yellow:#ffd43b; --on-yellow:#13233d;
  --good:#1f9d55; --bad:#e0454f; --inline:#e3ecf8;
  --code-bg:#13233d; --code-ink:#eaf2ff;
  --c-comment:#8aa0c2; --c-str:#ffd43b; --c-kw:#ff8fa3; --c-self:#7fd6ff; --c-num:#b8a2ff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1829; --card:#17263d; --ink:#eaf1fc; --muted:#9db0cf; --edge:#4a6a9e; --soft:#2a3d5c;
    --accent:#6ea8e8; --on-accent:#0b1626; --good:#3ddc84; --bad:#ff6b73; --inline:#243752;
    --code-bg:#0a1220; --code-ink:#eaf2ff;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1829; --card:#17263d; --ink:#eaf1fc; --muted:#9db0cf; --edge:#4a6a9e; --soft:#2a3d5c;
  --accent:#6ea8e8; --on-accent:#0b1626; --good:#3ddc84; --bad:#ff6b73; --inline:#243752;
  --code-bg:#0a1220; --code-ink:#eaf2ff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Nunito','Trebuchet MS',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-weight:700; font-size:1.02rem; line-height:1.5;
}
.wrap{max-width:760px; margin:0 auto; padding:16px 14px 48px}
h1,h2,.display{font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif; font-weight:400; letter-spacing:.01em}
header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px}
h1{font-size:clamp(1.5rem,5.5vw,2.2rem); line-height:1.1; margin:0}
.iconbtn{
  flex:none; width:46px; height:46px; border-radius:50%; border:3px solid var(--edge); background:var(--card);
  font-size:1.3rem; cursor:pointer; box-shadow:0 3px 0 var(--edge); color:var(--ink);
}
.iconbtn:active{transform:translateY(3px); box-shadow:0 0 0 var(--edge)}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px}

.hud{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px}
.hud div{background:var(--card); border:3px solid var(--edge); border-radius:12px; padding:6px 8px; text-align:center; line-height:1.15}
.hud small{display:block; color:var(--muted); font-size:.74rem; font-weight:800}
.hud b{font-family:'Lilita One',system-ui,sans-serif; font-weight:400; font-size:1.2rem}
.lost{filter:grayscale(1); opacity:.35}

.mascot{display:flex; align-items:center; gap:12px; margin:6px 0 16px}
.pet{font-size:3.4rem; line-height:1; flex:none; user-select:none}
.pet.hop{animation:hop .5s ease}
.pet.shake{animation:shake .45s ease}
.bubble{
  position:relative; background:var(--yellow); color:var(--on-yellow); border:3px solid var(--edge);
  border-radius:18px 18px 18px 4px; padding:10px 14px; font-weight:800; line-height:1.35; min-height:48px;
  display:flex; align-items:center;
}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-8deg)}70%{transform:translateY(0) rotate(5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-6deg)}50%{transform:translateX(8px) rotate(6deg)}80%{transform:translateX(-5px)}}

.card{background:var(--card); border:3px solid var(--edge); border-radius:20px; padding:18px; box-shadow:0 6px 0 var(--edge)}
.card.center{text-align:center}
.card h2{font-size:1.55rem; line-height:1.15; margin:0 0 8px}
.big{font-size:3.6rem; line-height:1.1}
p{margin:0 0 10px}
.muted{color:var(--muted)}

.qhead{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
.badge{background:var(--yellow); color:var(--on-yellow); border:2px solid var(--edge); border-radius:99px; padding:2px 12px; font-size:.88rem; font-weight:800}
.count{color:var(--muted); font-size:.9rem}
.timer{height:12px; background:var(--soft); border-radius:99px; overflow:hidden; border:2px solid var(--edge); margin-bottom:14px}
.timer i{display:block; height:100%; width:100%; background:var(--accent); transition:width .1s linear}
.timer.low i{background:var(--bad)}
h2.q{font-size:1.4rem; line-height:1.25; margin:0 0 8px}

pre.code{
  background:var(--code-bg); color:var(--code-ink); border:3px solid var(--edge); border-radius:10px;
  padding:12px 14px; margin:10px 0 14px; overflow-x:auto; max-width:100%;
  font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; font-weight:400; font-size:.88rem; line-height:1.55; tab-size:4;
}
pre.code .c{color:var(--c-comment)} pre.code .s{color:var(--c-str)} pre.code .k{color:var(--c-kw); font-weight:600}
pre.code .se{color:var(--c-self)} pre.code .n{color:var(--c-num)}
pre.code .blank{background:var(--yellow); color:var(--on-yellow); border-radius:5px; padding:0 .5em; font-weight:600}
code{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:.88em; background:var(--inline); border-radius:6px; padding:1px 6px}

.opts{display:grid; gap:10px}
.opt{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
  background:var(--card); color:var(--ink); border:3px solid var(--edge); border-radius:12px;
  padding:10px 12px; font:inherit; box-shadow:0 4px 0 var(--edge);
}
.opt b{
  flex:none; width:32px; height:32px; border-radius:50%; background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center; font-family:'Lilita One',system-ui,sans-serif; font-weight:400;
}
.opt:hover:not(:disabled){background:var(--inline)}
.opt:active:not(:disabled){transform:translateY(4px); box-shadow:0 0 0 var(--edge)}
.opt:disabled{cursor:default}
.opt.right{background:color-mix(in srgb,var(--good) 24%,var(--card)); border-color:var(--good); box-shadow:0 4px 0 var(--good)}
.opt.right b{background:var(--good); color:#fff}
.opt.wrong{background:color-mix(in srgb,var(--bad) 24%,var(--card)); border-color:var(--bad); box-shadow:0 4px 0 var(--bad)}
.opt.wrong b{background:var(--bad); color:#fff}
.opt.dim{opacity:.55}

.fb{margin-top:16px; padding:12px 14px; border-radius:14px; border:3px solid var(--edge)}
.fb.ok{border-color:var(--good); background:color-mix(in srgb,var(--good) 14%,var(--card))}
.fb.no{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.fbh{font-family:'Lilita One',system-ui,sans-serif; font-size:1.2rem; margin:0 0 4px}
.pts{background:var(--yellow); color:var(--on-yellow); border-radius:99px; padding:0 10px; margin-left:6px; font-size:1rem}

.btn{
  display:inline-block; margin-top:10px; cursor:pointer; font-family:'Lilita One',system-ui,sans-serif; font-size:1.2rem;
  background:var(--yellow); color:var(--on-yellow); border:3px solid var(--edge); border-radius:14px; padding:10px 22px;
  box-shadow:0 5px 0 var(--edge);
}
.btn:active{transform:translateY(5px); box-shadow:0 0 0 var(--edge)}

details.review{border:3px dashed var(--edge); border-radius:14px; padding:10px 14px; margin:12px 0}
details.review summary{cursor:pointer; font-weight:800}
.defs{margin:8px 0 0; padding-left:20px}
.defs li{margin-bottom:6px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0}
.stats div{border:3px solid var(--edge); border-radius:12px; padding:8px 4px; background:var(--inline)}
.stats b{display:block; font-family:'Lilita One',system-ui,sans-serif; font-weight:400; font-size:1.5rem}
.stats small{color:var(--muted); font-weight:800}
.rank{font-family:'Lilita One',system-ui,sans-serif; font-size:1.5rem; margin:4px 0}
.namebox{margin:14px 0 6px}
.namebox label{display:block; font-weight:800; margin-bottom:6px}
.namebox input{width:100%; font:inherit; font-size:1.15rem; padding:10px 14px; border:3px solid var(--edge); border-radius:12px; background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--edge)}
.namebox input.err{border-color:var(--bad); box-shadow:0 4px 0 var(--bad)}
.namehint{color:var(--bad); min-height:1.4em; margin:6px 0 0; font-size:.92rem}
.cert{width:100%; height:auto; display:block; border:3px solid var(--edge); border-radius:10px; margin:12px 0 4px; background:#fff}
.btnrow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
.note{font-size:.9rem; color:var(--muted); margin-top:10px}
footer{text-align:center; color:var(--muted); font-size:.85rem; margin-top:22px}

.conf{position:fixed; top:-40px; pointer-events:none; z-index:50; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (max-width:480px){
  .hud{grid-template-columns:repeat(2,1fr)}
  .pet{font-size:2.8rem}
  h2.q{font-size:1.25rem}
}
@media (prefers-reduced-motion: reduce){
  .pet.hop,.pet.shake,.conf{animation:none}
  .timer i{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Pythonio y la Herencia Loca</h1>
    <button class="iconbtn" id="mute" aria-label="Silenciar o activar el sonido" title="Sonido">🔊</button>
  </header>

  <div class="hud" id="hud" hidden>
    <div><small>Nivel</small><b id="h-lvl">1</b></div>
    <div><small>Puntos</small><b id="h-score">0</b></div>
    <div><small>Racha</small><b id="h-streak">0</b></div>
    <div><small>Pizzas</small><b id="h-lives"></b></div>
  </div>

  <div class="mascot">
    <div class="pet" id="pet" aria-hidden="true">🐍</div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
  </div>

  <main id="app"></main>
  <footer>Programación Orientada a Objetos en Python: superclases, subclases, atributos, métodos y herencia.</footer>
</div>

<script>
/* ---------- Datos ---------- */
const LEVELS=[
  {emoji:'🥚',pet:'🐣',title:'Atributos y métodos',sub:'Pythonio acaba de nacer. ¿Qué TIENE un objeto y qué sabe HACER?',say:'Soy un objeto recién creado. Sé muy poco, ¡ayúdame!'},
  {emoji:'👨‍👩‍👧',pet:'🧐',title:'Familia y herencia',sub:'Pythonio conoce a su familia: superclases, subclases y quién heredó la nariz.',say:'Mi abuela clase me dejó todo en el testamento. ¿Qué heredé?'},
  {emoji:'💻',pet:'😬',title:'¡Código de verdad!',sub:'Aquí se lee código real. Respira, el código no muerde... casi.',say:'Código Python de verdad. Si no compila, la culpa es del Wi-Fi.'}
];

const Q=[
/* ===== Nivel 1: atributos y métodos ===== */
{lvl:0,tag:'Atributo o método',q:'¿Qué es `energia` en esta línea?',code:'self.energia = 100',
 o:['Un atributo','Un método','Una subclase','El café del profe'],a:0,
 e:'Un atributo es un dato que guarda el objeto. Aquí: 100 de energía... hasta el lunes a las 7 a.m.'},
{lvl:0,tag:'Atributo o método',q:'¿Qué es `comer` en este código?',code:'def comer(self):\n    self.energia += 10',
 o:['Un método','Un atributo','Una superclase','Un bug con hambre'],a:0,
 e:'Un método es una acción que el objeto sabe hacer y se define con def. Este come y recupera energía. Ojalá fuera tan fácil con la pizza.'},
{lvl:0,tag:'Atributo o método',q:'¿Cuál de estos es un MÉTODO?',
 o:['`self.edad = 15`','`self.color = "verde"`','`def ladrar(self):`','`self.peso = 12`'],a:2,
 e:'Los métodos se crean con def y son lo que el objeto sabe hacer. Los otros tres son atributos: lo que el objeto tiene.'},
{lvl:0,tag:'Atributo o método',q:'¿Cuál de estos es un ATRIBUTO?',
 o:['`def dormir(self):`','`self.peso = 12`','`def __init__(self):`','`print("Guau")`'],a:1,
 e:'Un atributo se guarda en el objeto con self.algo = valor. Es como la mochila del objeto: carga datos.'},
{lvl:0,tag:'Objeto y clase',q:'Si `Perro` es la clase, ¿qué es `mi_perro = Perro("Rex")`?',
 o:['Un objeto (una instancia)','Otra superclase','Un método','Una clase con bigote'],a:0,
 e:'La clase es el molde y el objeto es la galleta. Rex es una galleta con cola.'},
{lvl:0,tag:'Objeto y clase',q:'¿Qué representa `self` dentro de un método?',
 o:['El propio objeto que ejecuta el método','La superclase','El nombre de la clase','Una palabra de relleno que se puede borrar'],a:0,
 e:'self significa "yo mismo". Cuando Rex llama a ladrar(), self es Rex. Si lo borras, Python se enoja (y con razón).'},

/* ===== Nivel 2: familia y herencia ===== */
{lvl:1,tag:'Superclase y subclase',q:'¿Cuál es la SUPERCLASE (la clase padre)?',code:'class Gato(Animal):',
 o:['Gato','Animal','self','Miau'],a:1,
 e:'Animal, la que va entre paréntesis. Gato es la subclase: el hijo que heredó todo (menos las ganas de obedecer).'},
{lvl:1,tag:'Superclase y subclase',q:'¿Cuál es la SUBCLASE (la clase hija)?',code:'class Pizza(Comida):',
 o:['Comida','Pizza','Queso extra','Python'],a:1,
 e:'Pizza es la hija: hereda de Comida. Y sí, la piña también puede heredar, pero ese es otro debate.'},
{lvl:1,tag:'Herencia',q:'¿Qué es la herencia en POO?',
 o:['Una subclase recibe atributos y métodos de su superclase','Que el profe te deje su computadora en el testamento','Copiar y pegar el mismo código 50 veces','Borrar la clase padre para ahorrar espacio'],a:0,
 e:'Reutilizas código en vez de reescribirlo. Ser vago está bien si eres vago con inteligencia.'},
{lvl:1,tag:'Herencia',q:'`Animal` tiene el método `respirar()` y `Perro` hereda de `Animal`. ¿Qué pasa?',
 o:['Perro puede usar `respirar()` sin escribirlo de nuevo','Perro debe reescribir `respirar()` o se desmaya','Python lanza un error','Perro deja de respirar por rebelde'],a:0,
 e:'Código gratis por herencia: el Perro respira sin hacer ni un solo trámite.'},
{lvl:1,tag:'Sintaxis de herencia',q:'¿Cuál es la forma correcta de hacer que `Gato` herede de `Animal`?',
 o:['`class Gato(Animal):`','`class Gato extends Animal:`','`class Gato -> Animal:`','`class Animal(Gato):`'],a:0,
 e:'En Python el padre va entre paréntesis. "extends" es de otros lenguajes como Java, que te saluda desde lejos.'},
{lvl:1,tag:'Superclase y subclase',q:'Tienes `Vehiculo` (superclase), `Auto` y `Moto` (subclases). ¿Qué es VERDAD?',
 o:['Auto y Moto heredan de Vehiculo','Vehiculo hereda de Auto y Moto','Auto y Moto son la misma clase con bigote','Moto hereda de Auto porque sí'],a:0,
 e:'Las dos son hijas de Vehiculo: reciben lo suyo y cada una añade lo propio (la moto, el casco; el auto, el aire acondicionado).'},
{lvl:1,tag:'Herencia',q:'Regla del "es un". ¿Cuál relación SÍ tiene sentido como herencia?',
 o:['`Perro` es un `Animal`','`Perro` es un `Collar`','`Collar` es un `Perro`','`Animal` es un `Perro`'],a:0,
 e:'Un Perro ES UN Animal, eso es herencia. Un Perro TIENE un collar: eso es un atributo, no herencia.'},

/* ===== Nivel 3: código real ===== */
{lvl:2,tag:'¿Qué imprime?',q:'¿Qué imprime este programa?',
 code:'class Animal:\n    def hacer_ruido(self):\n        print("...")\n\nclass Vaca(Animal):\n    pass\n\nv = Vaca()\nv.hacer_ruido()',
 o:['`...`','`Muuu`','Error: Vaca no tiene `hacer_ruido`','No imprime nada'],a:0,
 e:'pass significa que la subclase no cambia nada: hereda el método tal cual. La vaca está en silencio filosófico.'},
{lvl:2,tag:'Sobrescritura (override)',q:'¿Qué imprime este programa?',
 code:'class Animal:\n    def hacer_ruido(self):\n        print("...")\n\nclass Vaca(Animal):\n    def hacer_ruido(self):\n        print("Muuu")\n\nVaca().hacer_ruido()',
 o:['`Muuu`','`...`','`Muuu` y luego `...`','Error'],a:0,
 e:'La Vaca escribió su propia versión del método y Python usa esa. La vaca por fin habló.'},
{lvl:2,tag:'Sobrescritura (override)',q:'Cuando la subclase escribe su propia versión de un método que ya existe en la superclase, se llama...',
 o:['Sobrescritura (override)','Clonación','Herencia inversa','Plagio con permiso'],a:0,
 e:'Override: el hijo dice "gracias, papá, pero esto lo hago a mi manera". Python usa la versión de la subclase.'},
{lvl:2,tag:'Completa el código',q:'¿Qué línea falta para llamar al constructor del padre?',
 code:'class Animal:\n    def __init__(self, nombre):\n        self.nombre = nombre\n\nclass Perro(Animal):\n    def __init__(self, nombre, raza):\n        ______________\n        self.raza = raza',
 o:['`super().__init__(nombre)`','`Animal = nombre`','`self.super(nombre)`','`import Animal`'],a:0,
 e:'super() llama a la superclase para que haga su parte: primero papá, después tú. Así Perro tiene nombre y raza.'},
{lvl:2,tag:'super()',q:'¿Para qué sirve `super()`?',
 o:['Para usar métodos y el constructor de la superclase desde la subclase','Para volver el programa un superhéroe','Para borrar la clase padre','Para que el código corra más rápido'],a:0,
 e:'super() es la llamada al padre: "oye, encárgate de tu parte, que yo me encargo de la mía".'},
{lvl:2,tag:'¿Qué imprime?',q:'¿Qué imprime este programa?',
 code:'class Animal:\n    def __init__(self, nombre):\n        self.nombre = nombre\n\nclass Loro(Animal):\n    pass\n\nl = Loro("Pepe")\nprint(l.nombre)',
 o:['`Pepe`','`nombre`','Error','`Loro`'],a:0,
 e:'Loro no define su propio __init__, así que usa el de Animal. Los atributos también se heredan: Pepe sigue siendo Pepe.'},
{lvl:2,tag:'Herencia en cadena',q:'¿De qué clases hereda `Cachorro`?',
 code:'class Animal: ...\nclass Perro(Animal): ...\nclass Cachorro(Perro): ...',
 o:['De `Perro` y, por tanto, también de `Animal`','Solo de `Perro`','Solo de `Animal`','De nadie, es huérfano'],a:0,
 e:'Herencia en cadena: abuelo, padre e hijo. Cachorro tiene todo lo de Perro y todo lo de Animal. Una familia con mucha herencia.'},
{lvl:2,tag:'super()',q:'¿Qué imprime este programa?',
 code:'class Animal:\n    def presentarse(self):\n        print("Soy un animal")\n\nclass Gato(Animal):\n    def presentarse(self):\n        super().presentarse()\n        print("y soy un gato")\n\nGato().presentarse()',
 o:['Dos líneas: `Soy un animal` y luego `y soy un gato`','Solo `y soy un gato`','Solo `Soy un animal`','Error'],a:0,
 e:'Gato sobrescribe presentarse() pero llama primero a la versión del padre con super(). Se presenta dos veces: primero el apellido, luego el nombre.'}
];

const GOOD=['¡Eso es! 🎉','¡Crack! Pythonio se quitaría el sombrero si tuviera cabeza.','Correcto. Hasta tu compu está orgullosa.','¡Bien! Eso merece una pizza 🍕.','Cero errores de sintaxis en ese cerebro.','¡Sí! Herencia dominada.'];
const BAD=['¡Ouch! Eso compiló en tu cabeza pero no en Python.','Error 404: respuesta no encontrada.','Pythonio se atragantó con la pizza.','Casi... pero no. Un SyntaxError de la vida.','Ctrl+Z, Ctrl+Z, Ctrl+Z...','¡Uy! Hasta los mejores copian el error de Stack Overflow primero.'];
const THINK=['Concéntrate... no vale preguntarle al vecino.','Respira. Es código, no una explosión.','Yo sé la respuesta, pero no te digo 🤐','Piensa rápido: la pizza se enfría.','¿Y si le preguntas a tu yo del futuro?'];

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const PER=4, TIME=25, TIME_CODE=35, LIVES=3;
let S=null, muted=false, playerName='';

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');}
function hl(code){
  const re=/(#.*)|("[^"\n]*"|'[^'\n]*')|(_{3,})|\b(class|def|return|print|pass|super|import|from|if|else)\b|\b(self)\b|(\b\d+\b)/g;
  let out='',last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    const t=esc(m[0]);
    if(m[1]) out+='<span class="c">'+t+'</span>';
    else if(m[2]) out+='<span class="s">'+t+'</span>';
    else if(m[3]) out+='<span class="blank">'+t+'</span>';
    else if(m[4]) out+='<span class="k">'+t+'</span>';
    else if(m[5]) out+='<span class="se">'+t+'</span>';
    else out+='<span class="n">'+t+'</span>';
    last=re.lastIndex;
  }
  return out+esc(code.slice(last));
}
function getBest(){try{return +localStorage.getItem('pythonio-best')||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem('pythonio-best',String(v))}catch(e){}}

/* ---------- Sonido (Web Audio, sin archivos externos) ---------- */
let actx=null;
function ac(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended'){try{actx.resume();}catch(e){}}
  return actx;
}
function tone(f,t0,d,type,vol,slideTo){
  if(muted) return;
  const a=ac(); if(!a) return;
  const t=a.currentTime+t0, o=a.createOscillator(), g=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
  g.gain.setValueAtTime(vol||.06,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+d+.03);
}
const sfx={
  click(){tone(660,0,.05,'square',.04)},
  start(){[392,523,659,784].forEach((f,i)=>tone(f,i*.09,.12,'square',.06))},
  level(){[523,587,659,784,1047].forEach((f,i)=>tone(f,i*.07,.1,'triangle',.09))},
  good(){tone(659,0,.1,'square',.06);tone(880,.09,.2,'square',.06)},
  streak(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.07,.12,'triangle',.09))},
  bad(){[[311,0],[294,.22],[277,.44]].forEach(([f,t])=>tone(f,t,.2,'sawtooth',.06));tone(262,.66,.6,'sawtooth',.07,150)},
  tick(){tone(1000,0,.03,'square',.025)},
  win(){[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.12,.15,'square',.06))},
  lose(){tone(200,0,.7,'sine',.15,60);tone(140,.1,.7,'sawtooth',.05,50)}
};
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(!muted)sfx.click();};

/* ---------- Mascota y HUD ---------- */
function say(emoji,text,anim){
  const p=$('#pet'); p.textContent=emoji; $('#bubble').innerHTML=fmt(text);
  if(anim){p.classList.remove('hop','shake');void p.offsetWidth;p.classList.add(anim);}
}
function hudUpdate(){
  $('#hud').hidden=false;
  const L=Math.min(2,Math.floor(Math.min(S.idx,S.queue.length-1)/PER));
  $('#h-lvl').textContent=(L+1)+' de 3';
  $('#h-score').textContent=S.score;
  $('#h-streak').textContent=S.streak+' 🔥';
  $('#h-lives').innerHTML='🍕'.repeat(S.lives)+'<span class="lost">'+'🍕'.repeat(LIVES-S.lives)+'</span>';
}
function confetti(n){
  const em=['🎉','✨','🐍','🍕','⭐','💙'];
  for(let i=0;i<(n||30);i++){
    const s=document.createElement('span'); s.className='conf'; s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw'; s.style.fontSize=(16+Math.random()*18)+'px';
    s.style.animationDuration=(2+Math.random()*2)+'s'; s.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),5200);
  }
}

/* ---------- Pantallas ---------- */
const REVIEW=`class Animal:                 # superclase
    def __init__(self, nombre):
        self.nombre = nombre  # atributo
    def comer(self):          # método
        print(self.nombre, "come")

class Perro(Animal):          # subclase: hereda de Animal
    def ladrar(self):         # método propio
        print("¡Guau!")

rex = Perro("Rex")            # rex es un objeto
rex.comer()                   # método heredado`;

function screenStart(){
  $('#hud').hidden=true;
  say('🐍','¡Hola! Soy Pythonio. Dime tu nombre para anotarte en mi libro de herederos.','hop');
  const best=getBest();
  app.innerHTML=`<section class="card">
    <h2>¿Listo para heredar?</h2>
    <p>Responde 12 preguntas en 3 niveles sobre <b>superclases, subclases, atributos, métodos y herencia</b>. Tienes 3 pizzas 🍕: cada error te quita una. Mientras más rápido respondas, más puntos ganas.</p>
    <details class="review"><summary>📚 Repaso rápido (por si acaso)</summary>
      <pre class="code">${hl(REVIEW)}</pre>
      <ul class="defs">
        <li><b>Superclase</b> (clase padre): la que deja la herencia. Aquí, <code>Animal</code>.</li>
        <li><b>Subclase</b> (clase hija): la que hereda. Aquí, <code>Perro</code>.</li>
        <li><b>Atributo</b>: un dato del objeto, como <code>self.nombre</code>.</li>
        <li><b>Método</b>: una acción del objeto, como <code>comer()</code> o <code>ladrar()</code>.</li>
        <li><b>Herencia</b>: la subclase recibe los atributos y métodos de la superclase sin reescribirlos. ¡Perro también puede <code>comer()</code>!</li>
      </ul>
    </details>
    <p class="muted">Tiene sonido (puedes silenciarlo con el botón de arriba). Puedes responder con las teclas 1 a 4 o A a D, y seguir con Enter.</p>
    ${best?`<p>Tu mejor puntaje en este dispositivo: <b>${best}</b></p>`:''}
    <div class="namebox">
      <label for="pname">¿Cómo te llamas? Tu nombre saldrá en tu diploma final.</label>
      <input id="pname" type="text" maxlength="24" autocomplete="name" placeholder="Escribe tu nombre" value="">
      <p class="namehint" id="namehint" aria-live="polite"></p>
    </div>
    <button class="btn" id="primary">¡Jugar!</button>
  </section>`;
  const inp=$('#pname'); inp.value=playerName;
  inp.oninput=()=>{inp.classList.remove('err');$('#namehint').textContent='';};
  $('#primary').onclick=()=>{
    const v=inp.value.trim().replace(/\s+/g,' ');
    if(!v){inp.classList.add('err');$('#namehint').textContent='Escribe tu nombre para empezar.';inp.focus();sfx.tick();return;}
    playerName=v.slice(0,24);
    sfx.start(); startGame();
  };
}

function startGame(){
  const queue=[];
  [0,1,2].forEach(l=>queue.push(...shuffle(Q.filter(q=>q.lvl===l)).slice(0,PER)));
  S={queue,idx:0,score:0,lives:LIVES,streak:0,best:0,correct:0,shown:-1,locked:false,t:0,total:TIME,timer:null,cur:null};
  go();
}

function go(){
  if(S.lives<=0) return end(false);
  if(S.idx>=S.queue.length) return end(true);
  const L=Math.floor(S.idx/PER);
  if(L!==S.shown){S.shown=L;return levelIntro(L);}
  showQ();
}

function levelIntro(L){
  const d=LEVELS[L]; hudUpdate(); say(d.pet,d.say,'hop'); sfx.level();
  app.innerHTML=`<section class="card center">
    <div class="big">${d.emoji}</div>
    <p class="muted">Nivel ${L+1} de 3</p>
    <h2>${d.title}</h2>
    <p>${d.sub}</p>
    <button class="btn" id="primary">¡Vamos!</button>
  </section>`;
  $('#primary').onclick=()=>{sfx.click();showQ();};
}

function showQ(){
  const q=S.queue[S.idx]; S.locked=false;
  const opts=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));
  S.cur={q,opts};
  S.total=q.code?TIME_CODE:TIME; S.t=S.total;
  hudUpdate();
  say('🤔',pick(THINK));
  app.innerHTML=`<section class="card">
    <div class="qhead"><span class="badge">${esc(q.tag)}</span><span class="count">Pregunta ${S.idx+1} de ${S.queue.length}</span></div>
    <div class="timer" id="timer"><i id="tbar"></i></div>
    <h2 class="q">${fmt(q.q)}</h2>
    ${q.code?`<pre class="code" aria-label="Código Python">${hl(q.code)}</pre>`:''}
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCD'[i]}</b><span>${fmt(o.t)}</span></button>`).join('')}</div>
    <div id="fb" aria-live="polite"></div>
  </section>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sfx.click();answer(+b.dataset.i);});
  clearInterval(S.timer);
  S.timer=setInterval(tick,100);
}

function tick(){
  S.t-=0.1;
  const bar=$('#tbar'); if(!bar) return;
  bar.style.width=Math.max(0,S.t/S.total*100)+'%';
  const low=S.t<=6;
  $('#timer').classList.toggle('low',low);
  if(low&&S.t>0&&Math.abs(S.t-Math.round(S.t))<0.05) sfx.tick();
  if(S.t<=0) answer(-1);
}

function answer(i){
  if(S.locked) return; S.locked=true; clearInterval(S.timer);
  const {q,opts}=S.cur;
  const ok=i>=0&&opts[i].ok;
  document.querySelectorAll('.opt').forEach((b,k)=>{
    b.disabled=true;
    if(opts[k].ok) b.classList.add('right'); else if(k===i) b.classList.add('wrong'); else b.classList.add('dim');
  });
  let pts=0;
  if(ok){
    S.streak++; S.correct++; S.best=Math.max(S.best,S.streak);
    pts=100+Math.round(Math.max(0,S.t))*4+Math.min(S.streak-1,5)*10;
    S.score+=pts; sfx.good(); if(S.streak>=3) setTimeout(sfx.streak,450);
    say(pick(['😎','🤩','🥳','😄']),S.streak>=3?`¡Racha de ${S.streak}! 🔥 Pythonio está on fire.`:pick(GOOD),'hop');
  }else{
    S.lives--; S.streak=0; sfx.bad();
    say(i<0?'😴':pick(['🤯','😵','😅','🙈']),i<0?'⏰ Se acabó el tiempo. Pythonio se quedó dormido... ZzZ':pick(BAD),'shake');
  }
  hudUpdate();
  const last=S.lives<=0||S.idx+1>=S.queue.length;
  const right=opts.find(o=>o.ok).t;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">
    <p class="fbh">${ok?'✅ ¡Correcto!':(i<0?'⏰ ¡Tiempo!':'❌ Ups...')}${ok?`<span class="pts">+${pts}</span>`:''}</p>
    ${ok?'':`<p>La respuesta era: <b>${fmt(right)}</b></p>`}
    <p>${fmt(q.e)}</p>
    <button class="btn" id="primary">${last?'Ver resultado':'Siguiente'}</button>
  </div>`;
  $('#primary').onclick=()=>{sfx.click();S.idx++;go();};
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function end(finished){
  clearInterval(S.timer); hudUpdate();
  const c=S.correct;
  const rank=c===12?{t:'🏆 Arquitecto/a Supremo/a de la Herencia',d:'Pythonio te nombra heredero/a de todo su código. Sin errores y sin abogados.'}
    :c>=9?{t:'🥇 Programador/a Senior',d:'Dominas la herencia. Ya puedes pedirle aumento a tu yo del futuro.'}
    :c>=6?{t:'🥈 Junior con mucho potencial',d:'Vas muy bien. Repasa un poco y la próxima vez te llevas la corona.'}
    :{t:'🥉 Becario/a de la Herencia (café incluido)',d:'Todos empezamos así. Repasa y vuelve a intentarlo: ¡la herencia se gana practicando!'};
  const prev=getBest(); const newBest=S.score>prev; if(newBest) setBest(S.score);
  if(finished){
    say(c>=9?'🥳':'😅',c>=9?`¡Lo logramos, ${playerName}! Voy a heredar hasta el Wi-Fi del vecino.`:`Terminamos, ${playerName}. Con un repaso más, nos sale perfecto.`,'hop');
    sfx.win(); if(c>=9) confetti(36);
  }else{
    say('💀','Me quedé sin pizzas... Dile a mi superclase que la quiero.','shake');
    sfx.lose();
  }
  app.innerHTML=`<section class="card center">
    <div class="big">${finished?'🏁':'💀'}</div>
    <h2>${finished?'¡Terminaste el zoológico!':'Pythonio se quedó sin pizzas'}</h2>
    <p class="rank">${rank.t}</p>
    <p>${rank.d}</p>
    <div class="stats">
      <div><b>${S.score}</b><small>Puntos</small></div>
      <div><b>${c} de ${S.queue.length}</b><small>Aciertos</small></div>
      <div><b>${S.best}</b><small>Mejor racha</small></div>
    </div>
    ${newBest&&S.score>0?'<p>🎖️ ¡Nuevo récord personal en este dispositivo!</p>':''}
    <p class="muted">Diploma de <b>${esc(playerName)}</b></p>
    <canvas id="cert" class="cert" aria-label="Diploma con tu resultado"></canvas>
    <div class="btnrow">
      <button class="btn" id="dl" hidden>Descargar mi diploma</button>
      <button class="btn" id="primary">Jugar otra vez</button>
    </div>
    <p class="note" id="dlmsg" aria-live="polite"></p>
  </section>`;
  $('#primary').onclick=()=>{sfx.start();startGame();};
  setupCert(finished,rank.t);
}

/* ---------- Diploma descargable ---------- */
function slug(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase()||'alumno';}
function fit(x,text,maxW,px,fam){
  let p=px;
  for(;p>22;p-=2){x.font=p+'px '+fam;if(x.measureText(text).width<=maxW)break;}
  x.font=p+'px '+fam; return p;
}
async function drawCert(cv,d){
  try{await Promise.all([document.fonts.load('60px "Lilita One"'),document.fonts.load('700 28px "Nunito"')]);}catch(e){}
  const W=1200,H=800; cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  const D='"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif', B='"Nunito","Trebuchet MS",sans-serif';
  const NAVY='#13233d', YEL='#ffd43b', BLUE='#3776ab', MUTED='#4c5f7d';
  x.fillStyle='#e9f1fb'; x.fillRect(0,0,W,H);
  x.fillStyle=NAVY; x.fillRect(30,30,W-60,H-60);
  x.fillStyle='#ffffff'; x.fillRect(42,42,W-84,H-84);
  x.fillStyle=YEL; x.fillRect(42,42,W-84,150);
  x.fillStyle=NAVY; x.fillRect(42,192,W-84,6);
  x.textAlign='center'; x.textBaseline='alphabetic';
  x.font='84px sans-serif'; x.fillText('🐍',125,150); x.fillText('🐍',W-125,150);
  x.fillStyle=NAVY; x.font='62px '+D; x.fillText('Pythonio y la Herencia Loca',W/2,125);
  x.font='700 26px '+B; x.fillText('Programación Orientada a Objetos en Python',W/2,168);
  x.fillStyle=BLUE; x.font='700 32px '+B; x.fillText(d.finished?'Este diploma es para':'Este valiente intento es de',W/2,262);
  fit(x,d.name,980,112,D); x.fillStyle=NAVY; x.fillText(d.name,W/2,390);
  const nw=Math.min(x.measureText(d.name).width+60,1000);
  x.fillStyle=YEL; x.fillRect(W/2-nw/2,408,nw,8);
  fit(x,d.rank,1000,54,D); x.fillStyle=NAVY; x.fillText(d.rank,W/2,495);
  const stats=[[String(d.score),'Puntos'],[d.correct+' de '+d.total,'Aciertos'],[String(d.streak),'Mejor racha']];
  stats.forEach((s,i)=>{
    const bx=120+i*330;
    x.fillStyle='#e3ecf8'; x.fillRect(bx,535,300,120);
    x.strokeStyle=NAVY; x.lineWidth=4; x.strokeRect(bx,535,300,120);
    x.fillStyle=NAVY; x.font='54px '+D; x.fillText(s[0],bx+150,603);
    x.fillStyle=MUTED; x.font='700 24px '+B; x.fillText(s[1],bx+150,637);
  });
  x.fillStyle=MUTED; x.font='700 24px '+B;
  x.fillText(d.finished?'Superclases, subclases, atributos, métodos y herencia':'Se quedó sin pizzas, pero la herencia se gana practicando',W/2,708);
  x.font='700 22px '+B; x.fillText(d.date,W/2,748);
}
function setupCert(finished,rankText){
  const cv=$('#cert');
  const data={name:playerName,finished:finished,rank:rankText,score:S.score,correct:S.correct,total:S.queue.length,streak:S.best,
    date:new Date().toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'})};
  const ready=drawCert(cv,data);
  const btn=$('#dl'), msg=$('#dlmsg');
  (async()=>{
    let dl=null;
    try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
    if(!dl){msg.textContent='Para guardar tu diploma, haz una captura de pantalla (en el celular, mantén pulsada la imagen).';return;}
    btn.hidden=false;
    btn.onclick=async()=>{
      await ready; sfx.click();
      cv.toBlob(async blob=>{
        if(!blob){msg.textContent='No se pudo crear la imagen. Haz una captura de pantalla.';return;}
        try{await dl.save({filename:'diploma-pythonio-'+slug(playerName)+'.png',data:blob});msg.textContent='¡Listo! Tu diploma quedó guardado.';}
        catch(err){msg.textContent=(err&&err.code==='declined')?'Descarga cancelada. Puedes intentarlo de nuevo.':'No se pudo descargar. Haz una captura de pantalla del diploma.';}
      },'image/png');
    };
  })();
}

/* ---------- Teclado ---------- */
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key;
  if(e.target.tagName==='INPUT'){ if(k==='Enter'){const p0=$('#primary'); if(p0) p0.click();} return; }
  if(/^[1-4]$/.test(k)||/^[a-dA-D]$/.test(k)){
    const idx=/^[1-4]$/.test(k)?+k-1:k.toLowerCase().charCodeAt(0)-97;
    const b=document.querySelectorAll('.opt')[idx];
    if(b&&!b.disabled) b.click();
  }else if(k==='Enter'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='SUMMARY'){
    const p=$('#primary'); if(p) p.click();
  }
});

screenStart();
</script>
